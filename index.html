<!-- 
    3D Photo Christmas Tree
    
    Main entry point for the application.
    Structure:
    - #info: Overlay for title and instructions.
    - #gesture-ui: Overlay for webcam feed and gesture status.
    - Canvas: Created by Three.js in script.js for the 3D scene.
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Photo Christmas Tree</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 5px #000;
        }
        #gesture-ui {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 160px;
            height: 120px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            overflow: hidden;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror */
        }
        #gesture-status {
            position: absolute;
            bottom: 5px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #0f0;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 0 0 2px #000;
        }
        #start-camera {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid white;
            color: white;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 12px;
            z-index: 20;
        }
        #start-camera:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>🎄 3D 照片圣诞树 🎄</h1>
        <p>拖动旋转 • 滚轮缩放 • 👋 挥手控制旋转</p>
    </div>
    
    <div id="gesture-ui">
        <video id="webcam" autoplay playsinline></video>
        <div id="gesture-status">等待开启摄像头...</div>
        <button id="start-camera">开启摄像头</button>
    </div>

    <!-- Import map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <!-- Load the image list generated by python script -->
    <script src="images.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
